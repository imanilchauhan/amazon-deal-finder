name: post

# Fills every free hourly slot (9 AM-10 PM IST) in the next 6 hours with its own deal,
# scheduled in Buffer for that time (X + Facebook + Instagram). Booked slots live in Firestore.
# No browser, no scraping: ~1 minute per run. Every 2 hours = 84 posts/week per channel,
# under Buffer's free cap of 100/week per channel.
on:
  schedule:
    - cron: "41 */2 * * *"   # UTC; :41 avoids the top-of-hour queue spike
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pick the next deal but do not post it"
        type: boolean
        default: false
      test_platform:
        description: "Send one deal now to just this channel (x, facebook or instagram); leave empty for the normal run"
        type: string
        default: ""

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  post:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POSTING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Post next deal
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TEST_PLATFORM: ${{ inputs.test_platform || '' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          X_ENABLED: ${{ vars.X_ENABLED || 'false' }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          FB_ENABLED: ${{ vars.FB_ENABLED || 'false' }}
          BUFFER_FB_CHANNEL_ID: ${{ vars.BUFFER_FB_CHANNEL_ID }}
          IG_ENABLED: ${{ vars.IG_ENABLED || 'false' }}
          BUFFER_IG_CHANNEL_ID: ${{ vars.BUFFER_IG_CHANNEL_ID }}
          CARDS_BASE_URL: ${{ vars.CARDS_BASE_URL }}
          CARDS_UPLOAD_SECRET: ${{ secrets.CARDS_UPLOAD_SECRET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_FB_ACCOUNT_ID: ${{ vars.ZERNIO_FB_ACCOUNT_ID }}
          ZERNIO_IG_ACCOUNT_ID: ${{ vars.ZERNIO_IG_ACCOUNT_ID }}
          COLLECTION_POSTS: ${{ vars.COLLECTION_POSTS || 'true' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cartcrush.pages.dev' }}
        run: python -m deal_finder.post_queue
