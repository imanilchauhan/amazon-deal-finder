name: app-push

# The app's once-a-day "today's new deals" notification (FCM topic daily-deals).
# Reads the product cache, not Firestore. Turn on with the repo variable PUSH_ENABLED=true once the
# app is out; the service account needs roles/firebasecloudmessaging.admin.
on:
  schedule:
    - cron: "31 13 * * *"   # 7:01 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the message but do not send it"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  push:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUSH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install firebase-admin==6.9.0 requests==2.32.5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Send today's push
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CARDS_BASE_URL: ${{ vars.CARDS_BASE_URL || 'https://cartcrush-cards.imanilchauhan3.workers.dev' }}
        run: python -m deal_finder.push
