name: deals

on:
  schedule:
    # Every 4 hours at :17 (avoids the top-of-hour queue spike). Times are UTC.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape + validate only (no Firestore writes, no posts)"
        type: boolean
        default: false
      max_products:
        description: "Festive run: how many deals to collect and save to Firestore (blank = repo default)"
        type: string
        default: ""
      asins:
        description: "Scrape exactly these ASINs (comma or space separated), save them and tag them trending"
        type: string
        default: ""

# Never let two runs overlap (prevents double posting).
concurrency:
  group: deals
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # GitHub OIDC token -> Google Cloud (keyless Firestore access)

jobs:
  run:
    # Scheduled runs only fire once repo variable SCHEDULE_ENABLED=true; manual runs always work.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # Only needed once Meta (FB/IG video) posting is enabled.
      - name: Install ffmpeg
        if: vars.META_ENABLED == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Gate — schema & unit tests must pass before touching external services
        run: python -m pytest -q

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        if: ${{ !inputs.dry_run && vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Run deal pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE || 'in' }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}   # not secret: it appears in every link
          MAX_PRODUCTS: ${{ inputs.max_products || vars.MAX_PRODUCTS || '15' }}
          ASINS: ${{ inputs.asins }}
          MIN_DISCOUNT_PCT: ${{ vars.MIN_DISCOUNT_PCT || '20' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          DM_KEYWORD: ${{ vars.DM_KEYWORD || 'DEAL' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          # Product cache (catalog.json on the cards Worker) that the site build and admin read.
          CARDS_BASE_URL: ${{ vars.CARDS_BASE_URL }}
          CARDS_UPLOAD_SECRET: ${{ secrets.CARDS_UPLOAD_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}   # optional fallback to keyless auth
          # X: "buffer" = free via Buffer's API; "api" = X API pay-per-use ($0.20 per post with a link).
          # Posting moved to post.yml (one deal per run from the Firestore queue); this job only scrapes.
          X_ENABLED: "false"
          X_PUBLISHER: ${{ vars.X_PUBLISHER || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          X_MAX_POSTS_PER_RUN: "0"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          META_ENABLED: "false"
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          IG_POST_MODE: ${{ vars.IG_POST_MODE || 'reel' }}
          FB_POST_MODE: ${{ vars.FB_POST_MODE || 'photo' }}
        run: python -m deal_finder

      # The website is a static export, so rebuild it to pick up the new deals.
      - name: Rebuild website on Cloudflare Pages
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" -d ""; else echo "CLOUDFLARE_DEPLOY_HOOK not set; skipping"; fi

      - name: Upload run output (summary + rendered media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-run-${{ github.run_id }}
          path: backend/out/
          retention-days: 3
          if-no-files-found: ignore
