name: deal_finder
description: CartCrush — today's best Amazon India deals (Android and iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/taxonomy.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#E5484D"
  adaptive_icon_foreground: assets/icon-foreground.png
  remove_alpha_ios: true
